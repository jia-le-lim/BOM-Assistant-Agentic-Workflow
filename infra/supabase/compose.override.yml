# Layered over the pinned official configuration by manage.py.
# !override prevents Docker Compose from retaining upstream public port bindings.
services:
  api-gw:
    ports: !override
      - "127.0.0.1:18000:8000"
  supavisor:
    ports: !override []
  db:
    volumes:
      - postgres-data:/var/lib/postgresql/data
  storage:
    volumes:
      - storage-data:/var/lib/storage
  imgproxy:
    volumes:
      - storage-data:/var/lib/storage:ro
  studio:
    volumes:
      - studio-snippets:/app/snippets
  auth:
    environment:
      GOTRUE_JWT_KEYS: ${JWT_KEYS}
  realtime:
    environment:
      API_JWT_JWKS: ${JWT_JWKS}
  functions:
    environment:
      SUPABASE_JWKS: ${JWT_JWKS}

volumes:
  postgres-data:
  storage-data:
  studio-snippets:
